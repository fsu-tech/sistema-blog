<div class="blog-container">

  <h1>Sistema Blogging</h1>

  <!-- Área del formulario -->
  <div class="formulario">
    <h2>Nueva Publicación</h2>

    <form>
      <input type="text" placeholder="Título">
      <input type="text" placeholder="URL de la imagen">
      <textarea placeholder="Texto de la noticia"></textarea>
      <input type="date">
      <button type="submit">Publicar</button>
    </form>

  </div>

  <!-- Área del listado -->
  <div class="listado">
    <h2>Noticias Publicadas</h2>

    <div class="noticia">
      <h3>Título de ejemplo</h3>
      <img src="https://picsum.photos/600/300">
      <p>Texto de ejemplo de la noticia.</p>
      <small>2025-02-17</small>
    </div>

  </div>

</div>
